name: Unpublish package version from npm

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to unpublish
        required: true
        type: choice
        options:
          - ifc-expressions
          - ifc-expressions-units
          - ifc-expressions-units-qudtlib
      version:
        description: Exact semantic version to unpublish
        required: true
        type: string
      confirm:
        description: I understand this permanently removes the selected version
        required: true
        default: false
        type: boolean

permissions: {}

jobs:
  unpublish:
    name: Unpublish exact package version
    if: inputs.confirm
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npm-unpublish
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Validate exact version
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          node -e 'const version = process.env.PACKAGE_VERSION; const exact = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/.test(version); if (!exact) { console.error(`Not an exact semantic version: ${version}`); process.exit(1); }'

      - name: Verify target exists
        env:
          PACKAGE_NAME: ${{ inputs.package }}
          PACKAGE_VERSION: ${{ inputs.version }}
        run: npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version --json

      - name: Unpublish selected version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_UNPUBLISH_TOKEN }}
          PACKAGE_NAME: ${{ inputs.package }}
          PACKAGE_VERSION: ${{ inputs.version }}
        run: npm unpublish "$PACKAGE_NAME@$PACKAGE_VERSION"

      - name: Record result
        env:
          PACKAGE_NAME: ${{ inputs.package }}
          PACKAGE_VERSION: ${{ inputs.version }}
        run: echo "Unpublished $PACKAGE_NAME@$PACKAGE_VERSION" >> "$GITHUB_STEP_SUMMARY"
