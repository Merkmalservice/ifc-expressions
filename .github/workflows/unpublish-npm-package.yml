name: Unpublish package version from npm

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to unpublish
        required: true
        type: choice
        options:
          - ifc-expressions
          - ifc-expressions-units
          - ifc-expressions-units-qudtlib
      version:
        description: Version to unpublish
        required: true
        type: string

jobs:
  unpublish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org/
      - run: npm unpublish "${{ inputs.package }}@${{ inputs.version }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_ACCESS_TOKEN }}
