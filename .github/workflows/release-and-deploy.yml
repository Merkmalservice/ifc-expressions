name: Release package to npm

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to release
        required: true
        type: choice
        options:
          - ifc-expressions
          - ifc-expressions-units
          - ifc-expressions-units-qudtlib
      release-type:
        description: Exact version or npm version bump type
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.MMS_GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          registry-url: https://registry.npmjs.org/
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test -- --runInBand

      - name: Select and version package
        shell: bash
        env:
          PACKAGE_NAME: ${{ inputs.package }}
          RELEASE_TYPE: ${{ inputs.release-type }}
        run: |
          PACKAGE_DIR="packages/$PACKAGE_NAME"
          VERSION=$(cd "$PACKAGE_DIR" && npm --no-git-tag-version version "$RELEASE_TYPE")
          echo "PACKAGE_DIR=$PACKAGE_DIR" >> "$GITHUB_ENV"
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> "$GITHUB_ENV"
          echo "NEW_VERSION=${VERSION#v}" >> "$GITHUB_ENV"
          if [[ "$RELEASE_TYPE" == pre* || "$RELEASE_TYPE" == *-* ]]; then
            echo "RELEASE_TAG=beta" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=latest" >> "$GITHUB_ENV"
          fi

      - run: pnpm install --lockfile-only

      - name: Commit and tag selected package
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$PACKAGE_DIR/package.json" pnpm-lock.yaml
          git commit -m "Release $PACKAGE_NAME@$NEW_VERSION"
          git tag "$PACKAGE_NAME@$NEW_VERSION"

      - name: Publish selected package
        run: pnpm --filter "$PACKAGE_NAME" publish --access public --tag "$RELEASE_TAG" --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_ACCESS_TOKEN }}

      - name: Push release commit and tag
        run: |
          git push origin HEAD
          git push origin "$PACKAGE_NAME@$NEW_VERSION"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.PACKAGE_NAME }}@${{ env.NEW_VERSION }}
          prerelease: ${{ env.RELEASE_TAG == 'beta' }}
