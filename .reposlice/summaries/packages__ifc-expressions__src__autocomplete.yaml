headline: Type-sensitive parser-aware expression completion
summary_md: |
  Computes context-sensitive completion items from parser state and the same static type/member metadata used by compilation. It completes builtin roots, functions, chained context-object members, and valid infix continuations, preserving replacement spans and localized documentation. Once the expression before the caret is complete, static validation supplies its type: logical values receive boolean operators, numeric values receive arithmetic, strings receive concatenation, comparable values receive relational operators, and equality respects context-object factory capabilities. Callers may provide an expected result type to rank operators that produce that type first. Context-object member completion delegates to `ContextObjectMemberProvider`, honors provider case sensitivity, caps large result sets, and propagates `isIncomplete` so editors can request a narrower prefix. Member access recognizes reserved literal tokens such as `UNKNOWN` after a dot, enabling provider constants without changing ordinary literal parsing.
