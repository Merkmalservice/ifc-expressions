headline: Trusted npm staging and multi-version Node CI
summary_md: "CI installs the frozen pnpm lockfile on Node.js 22, 24, and 26 and then builds, typechecks, tests, and checks every package. The main-only release workflow uses Node.js 26.13.1 and Changesets to open a version pull request or produce verified tarballs and a publish plan. The npm-release environment grants OIDC only to the staging job, which downloads the verified artifacts and submits them for npm maintainer approval using their planned dist-tags. Emergency unpublish uses a separate protected environment and token.\r\n"
