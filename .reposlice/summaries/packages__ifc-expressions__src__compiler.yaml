headline: Static validation and typed expression compilation
summary_md: "IfcExpressionValidationListener resolves builtin roots and member types, validates arguments and operators through TypeManager, and records expression types before ExprCompiler maps parse contexts to evaluator nodes and source spans. The grammar and compiler use separate contexts for &&, ><, and ||, in descending precedence after unary !. Nominal object equality requires matching factories with equality support. Post-dot names can include reserved literals for provider catalogs.\r\n"
