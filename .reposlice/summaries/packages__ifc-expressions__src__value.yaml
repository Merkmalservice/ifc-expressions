head_tree: 8b4a1f99fceb2a2d377bff8c6d9b2d4ca56b15d3
headline: Boxed expression values and equality semantics
summary_md: |
  The value subsystem boxes primitive, logical, temporal, array, IFC-accessor, and client context-object values behind the generic `Value` interface, which exposes raw value access, equality, string rendering, and expression type. Numeric and temporal values use semantic equality and ordering; boolean/logical values implement three-valued operations; arrays compare their elements. `ContextObjectValue` stores a raw record plus its `ExprType` and currently uses raw object-reference equality, while `ObjectAccessorValue` similarly uses accessor identity. `ExpressionValue` is the union consumed by the evaluator.
