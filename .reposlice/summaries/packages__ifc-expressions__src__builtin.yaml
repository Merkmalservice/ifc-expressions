headline: Typed builtin registration and runtime conversion
summary_md: |
  `BuiltinVariableRegistry` defines statically typed builtin roots and their property/function members, constructs `ContextObjectType` instances for member-bearing builtins, and includes the default `$element` and `$property` IFC object surfaces. Member definitions carry argument/return types and localized documentation, so the same definitions support compilation and completion. `BuiltinRuntimeValueConverter` converts host values into expression values according to expected `ExprType`, wrapping object values as `ContextObjectValue`; it also resolves builtin members case-insensitively and unwraps results for clients.
