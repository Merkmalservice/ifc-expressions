headline: Core parser, evaluator, and completion regression tests
summary_md: "Jest tests cover syntax, stringification, evaluation, temporal and boxed values, public exports, and unwrapping. SimpleIfcExpressionContext supplies representative IFC accessors. Evaluation cases cover mixed boolean precedence, lazy EXISTS guards, and short-circuit fallback. Completion cases cover typed operators, nested arguments, and builtin-result members. Context-object tests cover nominal identity, delegated equality, and lazy member-provider behavior.\r\n"
