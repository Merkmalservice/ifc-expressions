headline: Core compatibility and context-object regression corpus
summary_md: |
  Jest compatibility and regression corpus for the core expression package. It covers parsing and stringification, evaluation, static typing, autocomplete, builtin registration and member access, public exports, temporal and boxed values, text spans, and value unwrapping; `SimpleIfcExpressionContext.ts` supplies representative IFC accessors. Dedicated context-object tests pin legacy reference equality and verify nominal factory identity, delegated equality/inequality, compile-time rejection of cross-factory and unsupported operators, lazy member-provider completion, case sensitivity, and live eager-map compatibility. The suite currently contains 1,179 passing tests.
