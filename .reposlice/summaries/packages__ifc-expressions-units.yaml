headline: Provider-neutral unit and measure language environment
summary_md: |
  Implements the optional, provider-neutral units language layer without depending on a unit library. `provider.ts` defines opaque provider-owned unit/measure objects, conversion, equality, hierarchy, and lazy provider catalog contracts. `catalogs.ts` pins portable names to IFC4X3_ADD2: 510 SI unit/prefix aliases and 81 measure aliases. `createIfcExpressionUnitsEnvironment()` requires and validates an explicit provider, creates distinct nominal unit and measure context-object factories, and supplies typed `$unit`/`$measure` builtin definitions and runtime values. It exposes `$unit.convert`, `$unit.isConvertible`, `$measure.isSubKindOf`, portable constants, and optional case-sensitive provider catalogs. Tests use a mock provider to cover fatal missing/incomplete configuration, aliases, nominal equality, conversion, and unit/measure type separation.
