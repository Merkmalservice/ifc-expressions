head_tree: 5b2a46fcc03d436c7e1b610e60875c43a3d89586
headline: Provider-neutral units with occurrence provenance
summary_md: |
  Implements the optional, provider-neutral units language layer without depending on a unit library. `provider.ts` defines opaque provider-owned unit/measure objects, conversion, equality, hierarchy, and lazy provider catalogs; `catalogs.ts` pins 510 SI unit/prefix aliases and 81 measure aliases to IFC4X3_ADD2. `createIfcExpressionUnitsEnvironment()` requires and validates an explicit provider, creates distinct nominal unit and measure types, and supplies typed `$unit`/`$measure` builtins. Every concrete unit is an environment-owned `IfcExpressionUnitReference` carrying `catalog`, `project`, `explicit`, or `calculated` occurrence provenance. Its `isProjectUnit()` and `isExplicitUnit()` members are available uniformly on catalog constants, result units, and direct or navigated property units, while equality and conversion delegate only the wrapped provider unit. Environment constructors prevent raw or foreign-environment units from entering a unit-typed expression member. Tests cover configuration failures, aliases, conversion, nominal typing, provenance semantics, navigated properties, ownership enforcement, and predicate autocomplete.
