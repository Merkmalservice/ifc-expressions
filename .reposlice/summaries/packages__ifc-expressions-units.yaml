headline: Provider-neutral units and occurrence provenance
summary_md: "provider.ts defines provider-owned unit and measure objects, conversion, equality, hierarchy, and lazy catalogs. catalogs.ts contains the pinned IFC4X3_ADD2 aliases. createIfcExpressionUnitsEnvironment validates an explicit provider and exposes typed $unit and $measure builtins and nominal unit and measure types. Unit references carry occurrence provenance for catalog, project, explicit, default, calculated, and unknown units. Equality and conversion delegate to the provider; environment constructors reject foreign unit references. Tests cover configuration errors, conversion, provenance, member access, and completion.\r\n"
