headline: Provider-neutral units extension package
summary_md: |
  Publishable provider-neutral unit-extension package skeleton. Its ESM entry point is `src/index.ts`, compiled to `dist` with the shared TypeScript baseline. It declares `ifc-expressions` as a peer dependency and uses the workspace package for development. Provider contracts and `$unit`/`$measure` registration will be implemented here without introducing a concrete unit library dependency.
