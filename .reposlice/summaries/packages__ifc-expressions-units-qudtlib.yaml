headline: QUDT-backed unit provider and literal catalogs
summary_md: |
  Provides the default `ifc-expressions-units` implementation backed by `@qudtlib/allunits` 7.1.0. `QudtUnitProvider` maps all portable IFC4X3_ADD2 aliases to QUDT `Unit` and `QuantityKind` objects, delegates identity, conversion, convertibility, and quantity-kind hierarchy to QUDT, and constructs valid provider-level scaled units when QUDT has no catalog constant. Literal, case-sensitive `$unit.QUDT.*` and `$measure.QUDT.*` catalogs expose the upstream JavaScript constant names with bounded lazy completion. The package re-exports useful QUDT objects and tests all portable bindings, conversion, hierarchy, case collisions, completion, and parser compatibility for all 3,076 unit plus 1,208 quantity-kind constants.
