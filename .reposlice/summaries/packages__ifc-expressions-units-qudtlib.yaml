headline: QUDT unit-provider package
summary_md: |
  Publishable QUDT provider package skeleton. Its ESM entry point is `src/index.ts`, compiled to `dist` with the shared TypeScript baseline. It declares both `ifc-expressions` and `ifc-expressions-units` as peer dependencies and links their workspace packages for development. QUDT-backed catalogs, conversion, identity, hierarchy, and anonymous derived-unit support will be implemented here.
